[package]
name = "reloop-email"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
description = "Rust SDK for the Reloop email API"
repository = "https://github.com/reloop-labs/reloop-rust"
homepage = "https://reloop.sh"
readme = "README.md"

[dependencies]
reqwest = { version = "=0.11.18", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
